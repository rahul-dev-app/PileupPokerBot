<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:440px;height:280px;background:linear-gradient(135deg,#1d2230,#3a2f55);font-family:system-ui,sans-serif;color:#fff;display:flex;align-items:center;gap:22px;padding:0 26px;box-sizing:border-box;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(4,34px);gap:5px;flex:none}
.c{width:34px;height:46px;border-radius:5px;background:#fff;color:#1d2230;font:700 14px/1 system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.35)}
.c.r{color:#d0302f}.c.e{background:rgba(255,255,255,.12);box-shadow:none}.c.hl{outline:3px solid #ff2bd6;outline-offset:1px}
h1{margin:0 0 10px;font-size:29px;white-space:nowrap}p{margin:0;font-size:15px;line-height:1.45;color:#e3dff0}b{color:#ffd166}
</style></head><body>
<div class="grid">
<div class="c">J<br>♠</div><div class="c r">Q<br>♥</div><div class="c">K<br>♣</div><div class="c r">A<br>♦</div>
<div class="c r">9<br>♥</div><div class="c r">9<br>♦</div><div class="c e"></div><div class="c">9<br>♠</div>
<div class="c">7<br>♣</div><div class="c e hl"></div><div class="c r">8<br>♥</div><div class="c e"></div>
<div class="c r">10<br>♦</div><div class="c">6<br>♣</div><div class="c e"></div><div class="c">10<br>♠</div>
</div>
<div><h1>PokerGrid 4x4</h1><p>Play the 4x4 poker card game<br>against a <b>strong bot</b>,<br>then watch the replay.</p></div>
</body></html>
