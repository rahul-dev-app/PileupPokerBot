<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1280px;height:800px;background:linear-gradient(135deg,#2b2f3a,#3a2f55);font-family:system-ui,sans-serif;color:#fff;display:flex;align-items:center;justify-content:center;gap:80px}
.text h2{font-size:44px;margin:0 0 18px}.text p{font-size:22px;line-height:1.5;margin:0;color:#e3dff0;max-width:500px}

<div class="text"><h2>Two modes</h2><p><b>Compete:</b> play without help, then see the bot play your exact hands.<br><br><b>Suggest:</b> the bot's best move while you play.<br><br>The bot runs in your browser. Nothing is sent anywhere.</p></div>
